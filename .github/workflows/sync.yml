name: Sync upstream repository

on:
  schedule:
    - cron: "* * * * *" # Runs every minute (subject to GitHub runner scheduling delays)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream master
        run: |
          git remote add upstream https://github.com/ihalili-info/BalkaniaHRM.git
          git fetch upstream master
          git checkout master
          git merge upstream/master --allow-unrelated-histories --no-edit
          git push origin master
